services:
  rainfall-flow-dashboard:
    build: .
    container_name: rainfall-flow-dashboard
    restart: unless-stopped
    environment:
      SQL_HOST: ${SQL_HOST}
      SQL_PORT: ${SQL_PORT}
      SQL_DATABASE: ${SQL_DATABASE}
      SQL_USER: ${SQL_USER}
      SQL_PASSWORD: ${SQL_PASSWORD}
      APP_TITLE: ${APP_TITLE}
    ports:
      - "8502:8501"
    networks:
      - wwtp-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  wwtp-net:
    external: true
