name: Build and Publish Well Depth Grapher

on:
  push:
    branches:
      - main
    paths:
      - "well-depth-grapher/**"
      - ".github/workflows/well-depth-grapher-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ncbrandon
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Well Depth Grapher image
        uses: docker/build-push-action@v6
        with:
          context: ./well-depth-grapher
          file: ./well-depth-grapher/Dockerfile
          push: true
          tags: ghcr.io/ncbrandon/well-depth-grapher:latest
