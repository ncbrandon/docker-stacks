services:
  fire-flow-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fire-flow-dashboard
    restart: unless-stopped
    environment:
      SQL_SERVER: ${SQL_SERVER}
      SQL_PORT: ${SQL_PORT}
      SQL_DATABASE: ${SQL_DATABASE}
      SQL_USER: ${SQL_USER}
      SQL_PASSWORD: ${SQL_PASSWORD}
    networks:
      - wwtp-net
      - tunnel
    ports:
      - "8504:8501"

networks:
  wwtp-net:
    external: true
  tunnel:
    external: true
